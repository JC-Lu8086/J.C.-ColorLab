name: Test and build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS-Apple-Silicon
          - os: windows-2022
            label: Windows-x64-experimental
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime, tests, and packaging dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run automated tests
        run: python -m pytest -q
      - name: Record exact build dependencies
        run: python -m pip freeze --all > build-environment.txt
      - name: Build desktop package
        run: python scripts/build.py
      - name: Preserve macOS app permissions and symbolic links
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist "JC-ColorLab-${{ matrix.label }}.zip"
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath "JC-ColorLab-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: JC-ColorLab-${{ matrix.label }}
          path: |
            JC-ColorLab-${{ matrix.label }}.zip
            build-environment.txt
          if-no-files-found: error
          retention-days: 14
